name: Collect patents

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-patents

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collecter
        env:
          PER_RUN: "1500"   # le blocage du moteur arrive avant ce plafond : c'est lui qui borne
          DELAY_MS: "5000"
        run: node scripts/collect.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus.json state.json
          if git diff --staged --quiet; then
            echo "Rien de neuf."
          else
            git commit -m "corpus: $(node -e "console.log(require('./corpus.json').length)") brevets"
            git push
          fi
