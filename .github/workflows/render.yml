name: Render images

on:
  schedule:
    - cron: "40 3,15 * * *"   # deux passes par jour : 500 images chacune
  workflow_dispatch:
    inputs:
      cap:
        description: "Nombre d'images visé"
        default: "2000"
      only:
        description: "Catégories à rendre, séparées par des virgules (vide = toutes)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: render-patents

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 170   # sous la limite dure de 6 h des runners GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pillow

      # L'identité git doit être posée AVANT le script : c'est lui qui commite
      # tous les 100 rendus, pour ne pas tout perdre si le job est interrompu.
      - name: Configurer git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rendre les images manquantes
        env:
          PER_RUN: "500"
          CHECKPOINT: "100"
          ONLY: ${{ github.event.inputs.only }}
          TIME_BUDGET: "8400"   # 2 h 20, marge sous le timeout du job
        run: python3 scripts/build.py corpus.json ${{ github.event.inputs.cap || 2000 }}

      - name: Commit final
        if: always()   # pousse même si le rendu s'est interrompu en erreur
        run: |
          git add docs/
          if git diff --staged --quiet; then
            echo "Rien de neuf."
            exit 0
          fi
          git commit -m "images: $(python3 -c "import json;print(json.load(open('docs/count.json'))['count'])") écrans"
          # La collecte horaire commite pendant que le rendu tourne : on rebase
          # avant de pousser, sinon la poussée est rejetée en "fetch first".
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          echo "Poussée impossible après 3 tentatives"
          exit 1
